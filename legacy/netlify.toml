# Netlify configuration for the RAREMEDIA website.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # On Netlify the contact form talks to the serverless function (same origin).
  VITE_CONTACT_API_URL = "/api/contact"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# SPA fallback: every non-file route serves the React app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
